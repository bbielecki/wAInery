name: Monorepo structural checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore wAInery.slnx
      - name: Compile full solution
        run: dotnet build wAInery.slnx --no-restore --configuration Release
      - name: Validate module reference boundaries
        run: dotnet run --project tests/Architecture/wAInery.ArchitectureChecks.csproj --no-restore --configuration Release
      - name: Run deterministic contract tests
        run: dotnet test --solution wAInery.slnx --no-build --no-restore --configuration Release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all wire schemas and synthetic examples
        run: |
          python3 -m pip install --isolated --index-url https://pypi.org/simple -r tools/requirements-contracts.txt
          python3 tools/validate-gate3-contracts.py

      - name: Validate shared Codex skills (including negative fixture)
        run: python3 scripts/validate_agent_skills.py
